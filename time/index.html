<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>何苇杭时区 - 慢中国一小时</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23D97757' d='M12 0C12.5 5.5 16.5 9.5 22 10V14C16.5 14.5 12.5 18.5 12 24H10C9.5 18.5 5.5 14.5 0 14V10C5.5 9.5 9.5 5.5 10 0H12Z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="time-page">
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C12.5 5.5 16.5 9.5 22 10V14C16.5 14.5 12.5 18.5 12 24H10C9.5 18.5 5.5 14.5 0 14V10C5.5 9.5 9.5 5.5 10 0H12Z" fill="currentColor"/>
                </svg>
                <span>章程</span>
            </a>
            <div class="nav-menu">
                <a href="/#about" class="nav-link">关于</a>
                <a href="/#experience" class="nav-link">经历</a>
                <a href="/#projects" class="nav-link">项目</a>
                <a href="/#research" class="nav-link">研究</a>
                <a href="/time/" class="nav-link active">何苇杭时区</a>
                <a href="/#contact" class="nav-link">联系</a>
            </div>
            <div class="nav-toggle">
                <span></span><span></span>
            </div>
        </div>
    </nav>

    <main class="main-content time-main">
        <section class="time-hero" aria-labelledby="time-title">
            <div class="time-copy">
                <div class="hero-badge time-badge">UTC+7 · China - 1h</div>
                <h1 id="time-title" class="hero-title">何苇杭时区</h1>
                <p class="hero-description">
                    中国标准时间减一小时。专为迟到大王、缓冲型人格、以及所有“马上到”的经典时刻校准。
                </p>
                <div class="time-tags" aria-label="何苇杭时区标签">
                    <span>迟到大王</span>
                    <span>没有时间观念</span>
                    <span>慢一小时出发</span>
                    <span>DDL 友好型人格</span>
                </div>
                <div class="time-facts" aria-label="何苇杭时区参数">
                    <div class="time-fact">
                        <span>时区偏移</span>
                        <strong>-01:00</strong>
                    </div>
                    <div class="time-fact">
                        <span>准点概率</span>
                        <strong>随缘</strong>
                    </div>
                    <div class="time-fact">
                        <span>到达状态</span>
                        <strong>马上</strong>
                    </div>
                </div>
            </div>

            <div class="time-feature" aria-label="何苇杭时区主题">
                <figure class="time-portrait-card">
                    <img src="../assets/he-weihang-time.png" alt="何苇杭时区主题照片" class="time-portrait" width="200" height="300">
                    <span class="portrait-badge">TIMEZONE MASCOT</span>
                    <span class="late-stamp">迟到认证</span>
                    <figcaption>本时区形象代言人</figcaption>
                </figure>

                <div class="clock-shell" aria-label="何苇杭时区时钟">
                    <div class="clock-header">
                        <span>HE WEIHANG STANDARD TIME</span>
                        <strong>-1H</strong>
                    </div>
                    <div class="clock-face">
                        <div class="clock-mark mark-12">12</div>
                        <div class="clock-mark mark-3">3</div>
                        <div class="clock-mark mark-6">6</div>
                        <div class="clock-mark mark-9">9</div>
                        <div class="clock-hand hour-hand" id="hourHand"></div>
                        <div class="clock-hand minute-hand" id="minuteHand"></div>
                        <div class="clock-hand second-hand" id="secondHand"></div>
                        <div class="clock-pin"></div>
                    </div>

                    <div class="time-panel">
                        <div class="timezone-label">何苇杭时区现在是</div>
                        <time id="digitalTime" class="digital-time" datetime="">--:--:--</time>
                        <div id="dateLine" class="date-line">正在校准时间...</div>
                        <div id="chinaTime" class="china-time">中国时间 --:--:--</div>
                    </div>
                    <div class="clock-note">慢一小时，稳定运行中</div>
                </div>
            </div>
        </section>
    </main>

    <script src="../script.js"></script>
    <script src="./time.js"></script>
</body>
</html>
